name: Release

# Runs when scripts/release.sh pushes a v<version> tag. Run it by hand
# (Actions → Release → Run workflow) to retry a tag whose release failed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build tools
        run: >
          dnf -y install --setopt=install_weak_deps=False
          git gh make rpm-build python3-devel python3-setuptools python3-build
          pyproject-rpm-macros "dnf-command(builddep)"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      # The checkout belongs to another uid than the container's root, and git
      # refuses to work in it until it is marked safe (the srpm Makefile runs git).
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' packaging/niri-settings.spec)
          test "v$version" = "$TAG" || {
            echo "::error::tag $TAG does not match spec version $version"; exit 1; }
      - name: Build sdist and wheel
        run: python3 -m build --no-isolation --outdir dist .
      - name: Build source and binary RPM
        # rpmbuild runs %check: the whole test suite against the packaged niri.
        run: |
          make -f .copr/Makefile srpm outdir="$PWD/dist"
          dnf -y builddep dist/*.src.rpm
          # %generate_buildrequires adds more (pip, regex): resolve and install those too.
          rpmbuild -rr dist/*.src.rpm --define "_srcrpmdir $PWD/br" || true
          dnf -y builddep br/*.buildreqs.nosrc.rpm
          rpmbuild --rebuild dist/*.src.rpm --define "_rpmdir $PWD/rpms"
          mv rpms/noarch/*.rpm dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents:body)' "$TAG")
          gh release create "$TAG" dist/* \
            --title "niri settings ${TAG#v}" \
            --notes "$notes" --generate-notes --verify-tag
