<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Scrolling columns, the focused one in the accent colour, over a slider. -->
  <defs>
    <clipPath id="tile"><rect x="8" y="8" width="112" height="112" rx="26"/></clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#161920"/>
  <g clip-path="url(#tile)">
    <rect x="-10" y="24" width="34" height="54" rx="8" fill="#2a3140"/>
    <rect x="32" y="24" width="64" height="54" rx="8" fill="#8fb0ff"/>
    <rect x="104" y="24" width="40" height="54" rx="8" fill="#2a3140"/>
  </g>
  <line x1="30" y1="96" x2="98" y2="96" stroke="#505868" stroke-width="6" stroke-linecap="round"/>
  <line x1="30" y1="96" x2="70" y2="96" stroke="#8fb0ff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="70" cy="96" r="9" fill="#e7e9ee"/>
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="#2a2f3a" stroke-width="2"/>
</svg>
