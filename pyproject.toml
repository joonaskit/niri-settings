[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niri-settings"
version = "0.1.0"
description = "A settings app for the niri compositor that edits its KDL config safely"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "niri_settings/fonts/OFL.txt"]
requires-python = ">=3.11"
# PySide6 comes from the distribution (Fedora: python3-pyside6), so it is not
# pinned here; `pip install .[pip]` pulls it from PyPI instead. `regex` lets
# window rules check Rust regex syntax Python's re lacks (Fedora: python3-regex).
dependencies = ["regex"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
]

[project.optional-dependencies]
pip = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/joonaskit/niri-settings"
Issues = "https://github.com/joonaskit/niri-settings/issues"

[project.gui-scripts]
niri-settings = "niri_settings.__main__:main"

[tool.setuptools]
packages = ["niri_settings", "niri_settings.schema"]

[tool.setuptools.package-data]
niri_settings = ["qml/*.qml", "qml/qmldir", "fonts/*.woff2", "fonts/*.txt", "fonts/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Errors only: undefined names, unused imports, syntax errors. CI runs this.
select = ["F", "E9"]
